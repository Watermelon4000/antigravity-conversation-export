[project]
name = "ag-export"
version = "0.1.0"
description = "Export Antigravity AI conversations locally with built-in privacy redaction"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.scripts]
ag-export = "ag_export.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
